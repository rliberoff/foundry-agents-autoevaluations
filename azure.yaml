# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: foundry-agents-autoevaluations

requiredVersions:
  extensions:
    azure.ai.agents: ">= 1.0.0-beta.12"

hooks:
  postdown:
    windows:
      shell: pwsh
      run: ./scripts/Reset-TerraformBackendCache.ps1
      interactive: false
      continueOnError: false
    posix:
      shell: sh
      run: bash ./scripts/reset-terraform-backend-cache.sh
      interactive: false
      continueOnError: false
  postprovision:
    windows:
      shell: pwsh
      run: ./scripts/Initialize-FoundryEvaluation.ps1
      interactive: false
      continueOnError: false
    posix:
      shell: sh
      run: bash ./scripts/initialize-foundry-evaluation.sh
      interactive: false
      continueOnError: false

services:
  agent-autoevaluations:
    project: ./src/Foundry.Agents.Autoevaluation.Demo
    host: azure.ai.agent
    language: docker
    kind: hosted
    name: agent-autoevaluations
    description: Agent Framework demo for production-trace-based autoevaluations.
    docker:
      path: ./Dockerfile
      context: ../../
      remoteBuild: true
    container:
      resources:
        cpu: "1"
        memory: 2Gi
    protocols:
      - protocol: responses
        version: 2.0.0
    environmentVariables:
      - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
        value: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
      - name: FoundryContinuousEvaluationOptions__EvaluationId
        value: ${FOUNDRY_EVALUATION_ID}
    hooks:
      postdeploy:
        windows:
          shell: pwsh
          run: ../../scripts/Grant-HostedAgentEvaluationRole.ps1
          interactive: false
          continueOnError: false
        posix:
          shell: sh
          run: bash ../../scripts/grant-hosted-agent-evaluation-role.sh
          interactive: false
          continueOnError: false

infra:
  provider: terraform
  layers:
    - name: backend
      path: ./infra/backend
    - name: resources
      path: ./infra/resources
      dependsOn:
        - backend
